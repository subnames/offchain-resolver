name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - resolver
      - main
    tags:
      - "v*"

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: benjlevesque/short-sha@v3.0
      - uses: olegtarasov/get-tag@v2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: packages/gateway
          file: packages/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:sha-${{ env.SHA }}
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:resolver
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
          docker tag ${IMAGE}:sha-${{ env.SHA }} ${IMAGE}:${{ env.GIT_TAG_NAME }}
          docker tag ${IMAGE}:sha-${{ env.SHA }} ${IMAGE}:latest
          docker push ${IMAGE}:${{ env.GIT_TAG_NAME }}
          docker push ${IMAGE}:latest
